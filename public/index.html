<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d3a1f"><meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Deer Ager">
<meta name="description" content="Estimate a whitetail's age from its jawbone, score the rack, and keep a private log of every buck.">
<link rel="icon" href="/logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/logo.svg"><title>Deer Ager</title>
<style>
:root{--bg:#f4f1e8;--card:#fff;--ink:#27301c;--mut:#667058;--acc:#2f6b3f;--accb:#e6efdf;--gold:#b8923a;--warn:#8a5200;--warnb:#fbefd5;--line:#ddd8c8;--bad:#a33}
@media (prefers-color-scheme:dark){:root{--bg:#141913;--card:#1e251d;--ink:#ecefe6;--mut:#9ba58f;--acc:#7cc78c;--accb:#243425;--gold:#d4ae55;--warn:#e6b25a;--warnb:#3a2f17;--line:#33402f;--bad:#e07a7a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));background:var(--card);border-bottom:1px solid var(--line)}
header a{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font:italic 700 20px Georgia,serif;flex:1;cursor:pointer}header a img{width:36px;height:36px}header a i{color:var(--gold)}
main{max-width:480px;margin:0 auto;padding:16px calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}main.wide{max-width:1000px}main.pub{padding-bottom:40px}
h1{font:italic 700 32px/1.15 Georgia,serif;margin:8px 0}h2{margin:6px 0 12px;font-size:22px}h3{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}.click{cursor:pointer}
button,.btn{font:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:12px 16px;background:var(--acc);color:#fff;font-weight:600;display:block;width:100%;text-align:center;text-decoration:none}
.alt{background:var(--accb);color:var(--acc)}.sm{display:inline-block;width:auto;min-height:36px;padding:7px 12px;font-size:14px}.danger{background:transparent;color:var(--bad)}.link{background:none;color:var(--acc);width:auto;min-height:0;padding:4px;display:inline;text-decoration:underline;font-weight:500}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:44px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);-webkit-appearance:none;appearance:none}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--acc);-webkit-appearance:auto;appearance:auto;flex:none}
label.l{display:block;margin:10px 0 4px;color:var(--mut);font-size:14px}label.ck{display:flex;gap:8px;align-items:center;margin:8px 0}
.row{display:flex;gap:10px;align-items:center}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mut{color:var(--mut);font-size:14px}.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--accb);color:var(--acc)}.tag.w{background:var(--warnb);color:var(--warn)}
.big{display:flex;gap:12px;align-items:center;text-align:left;margin-bottom:10px}.big .ic{font-size:28px}.big small{display:block;font-weight:400;opacity:.85}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.warn{background:var(--warnb);color:var(--warn);border-radius:12px;padding:12px;margin:0 0 12px;font-size:15px}
.note{border-left:3px solid var(--gold);padding-left:10px;font-size:13px;color:var(--mut)}.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.shot{display:flex;gap:12px;align-items:center}.thumb{width:56px;height:56px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font-size:22px;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}.shot.ok .thumb{border:2px solid var(--acc)}.shot.bad .thumb{border:2px solid var(--warn)}
.pick{display:block;text-align:center;margin:0}.score{font-size:34px;font-weight:800;color:var(--acc);line-height:1.15}.hero{text-align:center;padding:18px 0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--mut);font-weight:600}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}tr.best td{background:var(--accb);font-weight:600}
td input,td select{min-height:36px;padding:6px}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{width:auto;white-space:nowrap;min-height:38px;padding:8px 14px;background:var(--card);color:var(--ink);border:1px solid var(--line)}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.kpi{cursor:pointer}.kpi:hover{border-color:var(--acc)}.kpi .score{font-size:28px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:8px 0;font-size:12px;font-weight:500;min-height:54px}nav button.on{color:var(--acc);font-weight:700}nav span{display:block;font-size:20px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90vw}#toast.on{opacity:1}
.rhead{display:flex;gap:10px;align-items:center;margin-bottom:8px}.rhead img{width:44px;height:44px}
@media (hover:hover){button:hover:not(:disabled){filter:brightness(1.06)}}
@media (max-width:380px){.g3{grid-template-columns:1fr 1fr}}
@media print{header,nav,#toast,.noprint{display:none!important}body{background:#fff;color:#000}main{max-width:none;padding:0}.card{border:0;padding:0;margin:0 0 14px}:root{--bg:#fff;--card:#fff;--ink:#000;--mut:#444;--line:#bbb}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}};
const MSG={email_taken:'That email already has an account. Sign in instead.',bad_credentials:'Wrong email or password.',weak_password:'Use a password of at least 10 characters.',bad_email:'Enter a valid email address.',bad_state:'Use the 2-letter state code, e.g. TX.',bad_zip:'Enter a 5-digit ZIP code.',bad_phone:'Enter a valid phone number.',rate_limited:'Too many attempts. Wait a few minutes and try again.',subscription_required:'Start your subscription to scan new deer.',verify_required:'Confirm your email first.',data_locked:'Your data is locked until you resubscribe.',account_inactive:'This account is suspended.',analysis_failed:'The analysis service failed. Try again.',analysis_unavailable:'Analysis is not configured yet.',billing_not_configured:'Billing is not set up yet.',bad_token:'That link has expired. Request a new one.',unauthorized:'Please sign in again.',name_required:'Give the buck a name.'};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3000)};
async function api(p,o={}){const h={};const t=ls.get('t');if(t)h.authorization='Bearer '+t;if(o.json){h['content-type']='application/json';o.body=JSON.stringify(o.json)}
 const r=await fetch('/api'+p,{...o,headers:h});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&t){ls.set('t',null);S.me=null;S.view='login';draw()}const m=MSG[j.error]||(j.error||'').startsWith('missing_')&&'Please fill in every required field.'||j.detail||j.error||'Request failed';throw Object.assign(new Error(m),{code:j.error,status:r.status})}return j}
const S={me:null,plans:[],view:'splash',hist:[],mode:null,files:[],sh:[],buckName:'',buckId:'',bucks:[],res:null,scan:null,buck:null,tab:'overview',busy:false,ro:false,adm:null};
const fd=d=>d?new Date(d).toLocaleDateString():'–',money=c=>'$'+(c/100).toFixed(2);
const CFG={jaw:{t:'Jawbone photos',s:'Lower jaw, cleaned, on a plain background.',shots:['Left cheek side','Right cheek side','Top-down chewing surface','Close-up: premolars + first molar'],tips:'Use window light, no flash. Hold the phone parallel to the bone. Put a ruler or coin in frame.'},
deer:{t:'Deer photos',s:'A whole deer. This is a rough estimate.',shots:['Full-body side profile','Head, front or 3/4','Neck and belly line'],tips:'Stand square to the animal with the full body in frame and good light.'},
bc:{t:'Antler photo estimate',s:'Two angles with something of known size for scale.',shots:['Front or rear view, full rack','Side view of one antler'],tips:'Hold a ruler or hat next to the rack. Keep the camera level. Expect roughly +/-10-15 inches.'}};
const WIND=['N','NE','E','SE','S','SW','W','NW'],RUT=['Early / pre-rut','Seeking','Chasing','Peak breeding','Post-rut','Not rutting'],TACT=['Rattling','Grunting','Doe bleat','Doe urine / scent','Hay / food attractant','Mock scrape','Decoy','Cold front'];
const fld=(id,l,v='',t='text',x='')=>`<label class="l" for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(v)}" ${x}>`;
const val=id=>($('#'+id)||{}).value||'';
const logo=`<img src="/logo.svg" alt="">`;
function go(v,push=true){if(push&&S.view!==v&&!['prog'].includes(S.view))S.hist.push(S.view);S.view=v;draw();scrollTo(0,0)}
function back(){let v=S.hist.pop();while(v&&['prog','cap'].includes(v)&&S.view!=='cap')v=S.hist.pop();S.view=v||(S.me?'home':'splash');draw();scrollTo(0,0)}
function home(){S.hist=[];S.ro=false;S.view=S.me?(S.me.stage==='ready'?'home':S.me.stage==='verify'?'verify':'pay'):'splash';draw();scrollTo(0,0)}
function draw(){const a=$('#app');if(location.pathname.startsWith('/s/'))return;const v=S.view,m=S.me;
 const hd=`<header>${S.hist.length&&v!=='home'?`<button class="sm alt" onclick="back()" aria-label="Back">←</button>`:''}<a onclick="home()">${logo}<span>Deer <i>Ager</i></span></a>${m?`<button class="sm alt" onclick="go('account')">${esc(m.first_name||'Account')}</button>`:`<button class="sm alt" onclick="go('login')">Sign in</button>`}</header>`;
 const pub=!m||['verify','pay'].includes(v)&&!S.ro,ready=m&&(m.stage==='ready'||S.ro);
 const nav=ready?[['home','🏠','Home'],['bucks','🦌','Bucks'],['bc','📏','B&C'],['account','👤','Account']].concat(m.role==='admin'?[['admin','⚙️','Admin']]:[]):[];
 a.innerHTML=hd+`<main class="${v==='admin'?'wide':''} ${m?'':'pub'}">${(views[v]||views.splash)()}</main>`+(nav.length?`<nav>${nav.map(([k,i,l])=>`<button class="${v===k?'on':''}" onclick="${k==='admin'?'openAdmin()':`S.hist=[];go('${k}')`}"><span>${i}</span>${l}</button>`).join('')}</nav>`:'');
 ({bc:bcCalc,bucks:loadBucks,admin:adminTab})[v]?.();}
// ---------- public pages
const views={
splash(){const pl=S.plans.find(p=>p.id==='monthly'),an=S.plans.find(p=>p.id==='annual'),t=S.plans.find(p=>p.id==='trial');return `<div class="hero"><img src="/logo-full.svg" alt="Deer Ager" style="width:100%;max-width:340px"><h1>Know how old he really is.</h1><p class="mut" style="font-size:17px">Photograph a jawbone. Get an age estimate backed by three AI models, a printable report, and a private log of every buck you hunt.</p><button onclick="go('signup')">Start your ${t?t.trial_days:7}-day free trial</button><p style="margin-top:12px"><button class="link" onclick="go('login')">I already have an account</button></p></div>
<div class="card"><h3>📷 Guided photo capture</h3><div class="mut">Step-by-step jawbone shots with instant blur, glare and lighting checks.</div></div>
<div class="card"><h3>🧠 Three-model second opinion</h3><div class="mut">Claude, OpenAI and Gemini each read your photos. Your report shows where they agree and the data behind the top result.</div></div>
<div class="card"><h3>🦌 Name and track every buck</h3><div class="mut">Record stand, wind, temperature, rut phase, scents and calls, and notes. Only you (and support) can see them.</div></div>
<div class="card"><h3>📏 Boone &amp; Crockett estimate</h3><div class="mut">Gross, deductions and net for whitetail typical, clearly labeled as an estimate.</div></div>
<div class="g2"><div class="card"><h3>Monthly</h3><div class="score">${money(pl?pl.price_cents:799)}</div><div class="mut">per month</div></div><div class="card"><h3>Annual</h3><div class="score">${money(an?an.price_cents:4999)}</div><div class="mut">per year · saved data for life</div></div></div>
<p class="note">Card required to start your free trial. Cancel anytime in Account. Payments are handled by Stripe; we never see your card number.</p>`},
signup(){return `<h2>Create your account</h2><div class="card"><div class="g2"><div>${fld('fn','First name','','text','autocomplete="given-name"')}</div><div>${fld('ln','Last name','','text','autocomplete="family-name"')}</div></div>${fld('ad','Street address','','text','autocomplete="street-address"')}${fld('ci','City','','text','autocomplete="address-level2"')}<div class="g2"><div>${fld('st','State','','text','autocomplete="address-level1" maxlength="2" autocapitalize="characters" placeholder="TX"')}</div><div>${fld('zp','ZIP','','text','autocomplete="postal-code" inputmode="numeric"')}</div></div>${fld('ph','Phone','','tel','autocomplete="tel" inputmode="tel"')}${fld('em','Email','','email','autocomplete="email" inputmode="email" autocapitalize="none"')}${fld('pw','Password (10+ characters)','','password','autocomplete="new-password"')}<div class="err" id="ae"></div><button id="ab" onclick="signup()">Create account</button><p class="mut">We'll email you a link to confirm your address. After that you'll add a card to start your free trial.</p></div><p class="mut" style="text-align:center">Have an account? <button class="link" onclick="go('login')">Sign in</button></p>`},
login(){return `<h2>Sign in</h2><div class="card">${fld('em','Email','','email','autocomplete="email" inputmode="email" autocapitalize="none"')}${fld('pw','Password','','password','autocomplete="current-password" onkeydown="if(event.key===\'Enter\')login()"')}<div class="err" id="ae"></div><button id="ab" onclick="login()">Sign in</button><p style="margin:12px 0 0"><button class="link" onclick="go('forgot')">Forgot password?</button></p></div><p class="mut" style="text-align:center">New here? <button class="link" onclick="go('signup')">Create an account</button></p>`},
forgot(){return `<h2>Reset password</h2><div class="card"><p class="mut">Enter your email and we'll send a reset link.</p>${fld('em','Email','','email','autocomplete="email"')}<div class="err" id="ae"></div><button onclick="forgot()">Send reset link</button></div>`},
reset(){return `<h2>Choose a new password</h2><div class="card">${fld('pw','New password (10+ characters)','','password','autocomplete="new-password"')}<div class="err" id="ae"></div><button onclick="doReset()">Save password</button></div>`},
verify(){return `<div class="hero"><div style="font-size:48px">✉️</div><h2>Confirm your email</h2><p class="mut">We sent a link to <b>${esc(S.me.email)}</b>. Tap it to activate your account, then come back and continue.</p></div><button onclick="refresh()">I've confirmed, continue</button><p style="text-align:center"><button class="link" onclick="resendVerify()">Resend the email</button> · <button class="link" onclick="logout()">Sign out</button></p>`},
pay(){const m=S.me,pl=S.plans.find(p=>p.id==='monthly'),an=S.plans.find(p=>p.id==='annual'),t=S.plans.find(p=>p.id==='trial'),first=!m.stripe_sub;return `<h2>${first?'Start your free trial':'Choose a plan'}</h2><p class="mut">${first?`${t?t.trial_days:7} days free. A card is required; you won't be charged until the trial ends, and you can cancel any time.`:'Subscribe to scan new deer again.'}</p>
<div class="card"><h3>Annual · best value</h3><div class="score">${money(an?an.price_cents:4999)}<small style="font-size:15px;font-weight:400">/yr</small></div><div class="mut">Saved data stays yours for life, even if you stop.</div><button style="margin-top:10px" onclick="checkout('annual')">${first?'Start free trial':'Subscribe'}</button></div>
<div class="card"><h3>Monthly</h3><div class="score">${money(pl?pl.price_cents:799)}<small style="font-size:15px;font-weight:400">/mo</small></div><button class="alt" style="margin-top:10px" onclick="checkout('monthly')">${first?'Start free trial':'Subscribe'}</button></div>
<p class="note">Pay with credit or debit card, Apple Pay or Google Pay on Stripe's secure checkout.</p>${!m.data_locked?`<button class="alt" onclick="S.ro=true;go('bucks')">View my saved data</button>`:''}<p style="text-align:center"><button class="link" onclick="logout()">Sign out</button></p>`},
// ---------- app pages
home(){const m=S.me,tl=m.sub_status==='trialing';return `<h2>Welcome, ${esc(m.first_name)}</h2>${m.sub_status==='past_due'?`<div class="warn"><b>Payment failed.</b> Update your card to keep scanning. <button class="sm" style="margin-top:8px" onclick="portal()">Update card</button></div>`:''}${!m.can_scan&&m.sub_status!=='past_due'&&m.role!=='admin'?`<div class="warn">Scanning is paused. <button class="link" onclick="go('account')">Fix in Account</button></div>`:''}
<div class="card"><span class="tag">${m.role==='admin'?'Admin':tl?'Free trial':m.sub_status==='active'?'Pro':'Inactive'}</span> ${tl?`<b>${Math.max(0,m.trial_scans-m.scans_used)} trial scans left</b>`:''}${m.period_end&&m.sub_status!=='none'?`<div class="mut">${m.cancel_at_end?'Ends':'Renews'} ${fd(m.period_end)}</div>`:''}</div>
<h2>What are we aging?</h2><button class="big" onclick="startCap('jaw')"><span class="ic">🦴</span><span>Age a jawbone<small>Most accurate · 4 guided photos</small></span></button><button class="big alt" onclick="startCap('deer')"><span class="ic">🦌</span><span>Age a deer from photos<small>Rough estimate · 3 photos</small></span></button><button class="big alt" onclick="go('bc')"><span class="ic">📏</span><span>Boone &amp; Crockett score<small>Whitetail typical · estimate</small></span></button><button class="big alt" onclick="newBuck()"><span class="ic">📒</span><span>Add a buck to my log<small>Name it, record the hunt details</small></span></button>`},
cap(){const c=CFG[S.mode];return `<h2>${c.t}</h2><p class="mut">${c.s}</p><div class="card"><label class="l" for="bk">Buck name (optional)</label><input id="bk" list="bl" value="${esc(S.buckName)}" oninput="S.buckName=this.value" placeholder="e.g. Big Eight" maxlength="80"><datalist id="bl">${S.bucks.map(b=>`<option value="${esc(b.name)}">`).join('')}</datalist><div class="mut" style="margin-top:6px">Type a new name or pick an existing buck to attach these photos.</div></div>${S.sh.map((s,i)=>{const f=S.files[i];return `<div class="card"><div class="shot ${f?(f.ok?'ok':'bad'):''}"><div class="thumb">${f?`<img src="${f.url}" alt="">`:'📷'}</div><div><b>${i+1}. ${esc(s)}</b><div class="mut">${f?(f.ok?'Looks good':esc(f.msg)+' You can still use it.'):'Take or upload a photo'}</div></div></div><div class="g2" style="margin-top:10px"><label class="btn alt sm pick">📷 ${f?'Retake':'Take photo'}<input type="file" accept="image/*" capture="environment" hidden onchange="pick(${i},this)"></label><label class="btn alt sm pick">⬆ Upload<input type="file" accept="image/*" hidden onchange="pick(${i},this)"></label></div></div>`}).join('')}<div class="card"><h3>Tips</h3><div class="mut">${c.tips}</div></div><button id="goA" ${S.files.length&&S.files.every(Boolean)?'':'disabled'} onclick="analyze()">Analyze</button>`},
prog(){return `<div class="card" style="text-align:center;padding:40px 14px"><div style="font-size:44px">🔍</div><h3>Uploading and comparing models…</h3><div class="mut">This takes 10–40 seconds. Please keep this page open.</div></div>`},
res(){const r=S.res;return reportHtml(r,false)+(r.needs_more_photos?`<div class="warn noprint"><b>Get a more accurate result.</b> ${esc([...(r.flags.issues||[]),...(r.flags.missing||[])].join(' ')||'A clearer photo would help.')}<div style="margin-top:8px"><button class="sm" onclick="addExtra()">Add photo</button></div></div>`:'')},
report(){return reportHtml(S.scan,false)+`<div class="card noprint"><h3>Photos</h3><div class="g2">${(S.scan.photos||[]).map(p=>`<img src="${esc(p)}" alt="" style="width:100%;border-radius:10px">`).join('')||'<span class="mut">No photos.</span>'}</div><label class="l">Notes</label><textarea id="nt" rows="3">${esc(S.scan.notes||'')}</textarea><button class="sm alt" style="margin-top:8px" onclick="saveNotes()">Save notes</button> <button class="sm danger" onclick="delScan()">Delete scan</button></div>`},
bucks(){return `<h2>My bucks</h2><button class="alt" onclick="newBuck()" style="margin-bottom:12px">+ Add a buck</button><div id="bl2">${S.bucks.length?bucksList():'<div class="card mut">Loading…</div>'}</div>`},
buck(){const b=S.buck||{},t=b.tactics||[];return `<h2>${b.id?esc(b.name):'New buck'}</h2><div class="card">${fld('bn','Buck name',b.name||'','text','maxlength="80"')}<div class="g2"><div>${fld('bd','Date',(b.hunted_on||'').slice(0,10),'date')}</div><div>${fld('bt','Temp (°F)',b.temp_f??'','number','inputmode="numeric"')}</div></div>${fld('bo','Location / property',b.location||'')}${fld('bs','Stand',b.stand||'')}<div class="g2"><div><label class="l">Wind direction</label><select id="bw"><option value="">–</option>${WIND.map(w=>`<option ${b.wind_dir===w?'selected':''}>${w}</option>`).join('')}</select></div><div><label class="l">Rut phase</label><select id="br"><option value="">–</option>${RUT.map(w=>`<option ${b.rut_phase===w?'selected':''}>${w}</option>`).join('')}</select></div></div>

${(r.runs||[]).length?`<div class="card scroll"><h3>Model comparison</h3><table><tr><th>Model</th><th>Result</th><th>Confidence</th><th>Time</th></tr>${r.runs.map((x,i)=>`<tr class="${x.class&&r.best&&x.provider===r.best.provider?'best':''}"><td>${esc(x.provider)}${x.model?`<div class="mut">${esc(x.model)}</div>`:''}</td><td>${x.error?'<span class="mut">unavailable</span>':esc(x.class||'Unclear')}</td><td>${x.confidence==null?'–':x.confidence+'%'}</td><td>${x.ms==null?'–':(x.ms/1000).toFixed(1)+'s'}</td></tr>`).join('')}</table></div>`:''}

${share?'<p class="noprint" style="text-align:center"><button class="sm" onclick="print()">🖨 Print / save PDF</button> <a class="btn alt sm" href="/">Try Deer Ager</a></p>':`<div class="g3 noprint"><button class="alt" onclick="print()">🖨 Print / PDF</button><button class="alt" onclick="emailScan('${r.id}')">✉️ Email</button><button class="alt" onclick="shareScan('${r.id}')">🔗 Link</button></div>`}`}

// ---------- capture + analysis
async function startCap(m){if(!S.me.can_scan){toast(MSG.subscription_required);return go('account')}S.mode=m;S.sh=[...CFG[m].shots];S.files=S.sh.map(()=>null);try{if(S.me.stage==='ready')S.bucks=await api('/bucks')}catch{}go('cap')}
async function prep(file){const bm=await createImageBitmap(file),sc=Math.min(1,2000/Math.max(bm.width,bm.height)),w=Math.round(bm.width*sc),h=Math.round(bm.height*sc),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(bm,0,0,w,h);
 const sw=160,sh=Math.max(8,Math.round(160*h/w)),c2=document.createElement('canvas');c2.width=sw;c2.height=sh;const y=c2.getContext('2d',{willReadFrequently:true});y.drawImage(bm,0,0,sw,sh);const d=y.getImageData(0,0,sw,sh).data,g=[];let s=0;for(let i=0;i<d.length;i+=4){const v=.3*d[i]+.59*d[i+1]+.11*d[i+2];g.push(v);s+=v}const mean=s/g.length;let e=0;for(let j=1;j<sh-1;j++)for(let k=1;k<sw-1;k++){const n=j*sw+k,l=4*g[n]-g[n-1]-g[n+1]-g[n-sw]-g[n+sw];e+=l*l}e/=sw*sh;
 const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));let ok=true,msg='';if(bm.width<800&&bm.height<800){ok=false;msg='Resolution is low.'}else if(mean<45){ok=false;msg='Too dark.'}else if(mean>225){ok=false;msg='Too bright or glare.'}else if(e<20){ok=false;msg='Looks blurry.'}return{blob,ok,msg}}
async function pick(i,el){const f=el.files&&el.files[0];if(!f)return;let r;try{r=await prep(f)}catch{r={blob:f,ok:false,msg:'Could not preview this image.'}}if(S.files[i])URL.revokeObjectURL(S.files[i].url);S.files[i]={...r,url:URL.createObjectURL(r.blob)};draw()}
function addExtra(){const m=(S.res&&S.res.flags&&S.res.flags.missing&&S.res.flags.missing[0])||'a clearer angle';S.sh.push('Extra: '+m);S.files.push(null);go('cap')}
async function analyze(){if(S.busy)return;S.busy=true;S.view='prog';draw();try{let id=S.bucks.find(b=>b.name.toLowerCase()===S.buckName.trim().toLowerCase())?.id||'';if(!id&&S.buckName.trim()){id=(await api('/bucks',{method:'POST',json:{name:S.buckName.trim()}})).id}
 const fd=new FormData();fd.append('mode',S.mode);if(id)fd.append('buck_id',id);S.files.forEach((f,i)=>fd.append('photos',f.blob,`p${i}.jpg`));S.res=await api('/scans',{method:'POST',body:fd});S.me=await api('/me');S.hist=S.hist.filter(v=>v!=='cap');S.view='res'}catch(e){toast(e.message);S.view=e.status===402?'account':'cap'}S.busy=false;draw()}

 try{if(S.buck&&S.buck.id){await api('/bucks/'+S.buck.id,{method:'PUT',json:b});S.buck=await api('/bucks/'+S.buck.id)}else{S.buck=await api('/bucks',{method:'POST',json:b});S.buck=await api('/bucks/'+S.buck.id)}toast('Buck saved');draw()}catch(e){$('#ae').textContent=e.message}}

function bcv(){const L=[],R=[];for(let i=0;i<10;i++){L.push(+val('l'+i)||0);R.push(+val('r'+i)||0)}return{l:L,r:R,spread:+val('sp')||0,abnormal:+val('ab2')||0}}
function bcCalc(){if(!$('#gr'))return;const b=bcv(),sum=a=>a.reduce((x,y)=>x+y,0),g=sum(b.l)+sum(b.r)+Math.min(b.spread,Math.max(b.l[0],b.r[0])),d=b.l.reduce((a,v,i)=>a+Math.abs(v-b.r[i]),0)+b.abnormal,n=g-d;$('#gr').textContent=g.toFixed(1);$('#ne').textContent=n.toFixed(1);$('#bm').textContent=n>=160?'Above the 160" records-book minimum (estimate).':(160-n).toFixed(1)+'" below the 160" minimum (estimate).'}

 if(T==='settings'){const s=await api('/admin/settings');el.innerHTML=`<div class="card"><h3>Stripe</h3><div class="mut">Stored in the database; secrets are encrypted. Leave blank to keep the current value.</div>${fld('k1','Publishable key','','text',`placeholder="${esc(s.stripe_publishable_key)||'pk_…'}" autocomplete="off" autocapitalize="none"`)}${fld('k2','Secret key','','password',`placeholder="${esc(s.stripe_secret_key)||'sk_…'}" autocomplete="off"`)}${fld('k3','Webhook signing secret','','password',`placeholder="${esc(s.stripe_webhook_secret)||'whsec_…'}" autocomplete="off"`)}<div class="g2" style="margin-top:10px"><button onclick="saveKeys()">Save</button><button class="alt" onclick="adm('/stripe/test','Stripe connected')">Test connection</button></div><button class="alt" style="margin-top:10px" onclick="adm('/stripe/webhook','Webhook created and secret saved')">Create webhook automatically</button></div>
<div class="card"><h3>Email (Resend)</h3>${fld('k4','Resend API key','','password',`placeholder="${esc(s.resend_api_key)||'re_…'}" autocomplete="off"`)}${fld('k5','From address','','text',`placeholder="${esc(s.mail_from)||'Deer Ager &lt;noreply@deerager.com&gt;'}"`)}<button style="margin-top:10px" onclick="saveKeys()">Save</button><label class="l">Send a test email to</label><input id="k6" type="email" value="${esc(S.me.email)}"><button class="alt" style="margin-top:8px" onclick="testMail()">Send test</button></div>
<div class="card"><h3>Analysis</h3><label class="ck"><input type="checkbox" id="k7" ${s.compare_all!=='false'?'checked':''} onchange="saveCompare(this.checked)">Run every configured model on each scan (3-model comparison report)</label></div><div class="err" id="se"></div>`}
 if(T==='models'){const m=await api('/admin/benchmark/summary');el.innerHTML=`<div class="card scroll"><table><tr><th>Model</th><th>Runs</th><th>Exact %</th><th>Avg ms</th></tr>${m.map(x=>`<tr><td>${esc(x.provider)}</td><td>${x.n}</td><td>${x.exact_pct}</td><td>${x.ms}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">No lab-confirmed runs yet.</td></tr>'}</table></div><p class="note">Run <code>POST /api/admin/benchmark/:scanId</code> with a lab-confirmed truth_class to add accuracy data.</p>`}
}catch(e){el.innerHTML='<div class="err">'+esc(e.message)+'</div>'}}
function userTable(u,full){return `<div class="card scroll"><table><tr><th>Name</th><th>Email</th><th>Plan</th><th>Status</th><th>Scans</th>${full?'<th>Joined</th>':''}</tr>${u.map(x=>`<tr class="click" onclick="adminUser('${x.id}')"><td>${esc((x.first_name||'')+' '+(x.last_name||''))}${x.role==='admin'?' <span class="tag">admin</span>':''}</td><td>${esc(x.email)}</td><td>${esc(x.plan_id)}</td><td>${esc(x.sub_status)}${x.email_verified_at?'':' <span class="tag w">unverified</span>'}</td><td>${x.scans_used}</td>${full?`<td>${fd(x.created_at)}</td>`:''}</tr>`).join('')||'<tr><td colspan="6" class="mut">None.</td></tr>'}</table></div>`}
async function drill(k){S.view='adm-drill';draw();S.hist.length||S.hist.push('admin');try{const d=await api('/admin/drill/'+k),T={users:'All users',trials:'Free trials',subscribers:'Pro subscribers',scans:'Who is scanning the most',past_due:'Payment failed',unverified:'Unverified emails'}[k];
 $('#app main').innerHTML=`<h2>${T}</h2>`+(k==='scans'?`<div class="card scroll"><table><tr><th>#</th><th>User</th><th>Scans</th><th>Flagged</th><th>Last scan</th></tr>${d.map((x,i)=>`<tr class="click" onclick="adminUser('${x.id}')"><td>${i+1}</td><td>${esc(x.first_name+' '+x.last_name)}<div class="mut">${esc(x.email)}</div></td><td>${x.scans}</td><td>${x.flagged}</td><td>${fd(x.last_scan)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">No scans yet.</td></tr>'}</table></div>`:userTable(d,true));$('#app main').className='wide'}catch(e){toast(e.message)}}
async function adminUser(id){try{S.adm=await api('/admin/users/'+id);S.view='adm-user';if(!S.hist.includes('admin'))S.hist.push('admin');draw();const {user:u,scans,bucks,emails}=S.adm;$('#app main').className='wide';
 $('#app main').innerHTML=`<h2>${esc(u.first_name+' '+u.last_name)}</h2><div class="g2"><div class="card"><h3>Details</h3><div class="mut">${esc(u.email)}${u.email_verified_at?'':' (unverified)'}<br>${esc(u.phone)}<br>${esc(u.address)}, ${esc(u.city)}, ${esc(u.state)} ${esc(u.zip)}<br>Joined ${fd(u.created_at)} · ${u.scans_used} scans<br>Plan ${esc(u.plan_id)} · ${esc(u.sub_status)}${u.period_end?' · period end '+fd(u.period_end):''}<br>Stripe ${esc(u.stripe_customer||'–')}</div></div><div class="card"><h3>Actions</h3><div class="g2"><button class="alt" onclick="uAct('${u.id}','reset')">Send password reset</button><button class="alt" onclick="uAct('${u.id}','verify')">Resend confirmation</button><button class="alt" onclick="uPatch('${u.id}',{status:'${u.status==='active'?'suspended':'active'}'})">${u.status==='active'?'Suspend':'Restore'} account</button><button class="alt" onclick="uPatch('${u.id}',{lifetime_data:${!u.lifetime_data}})">${u.lifetime_data?'Remove':'Grant'} lifetime data</button></div></div></div>
<div class="card scroll"><h3>Scans (${scans.length})</h3><table>${scans.map(s=>`<tr class="click" onclick="openScan('${s.id}')"><td>${fd(s.created_at)}</td><td>${esc(s.mode)}</td><td>${esc(s.class||'Unclear')}</td><td>${s.confidence??'–'}%</td><td>${esc(s.buck||'')}</td></tr>`).join('')||'<tr><td class="mut">None.</td></tr>'}</table></div>
<div class="card scroll"><h3>Bucks (${bucks.length})</h3><table>${bucks.map(b=>`<tr><td><b>${esc(b.name)}</b></td><td>${fd(b.hunted_on)}</td><td>${esc([b.stand,b.wind_dir&&'wind '+b.wind_dir,b.temp_f!=null&&b.temp_f+'°F',b.rut_phase].filter(Boolean).join(' · '))}</td><td>${esc((b.tactics||[]).join(', '))}</td><td>${esc(b.notes||'')}</td></tr>`).join('')||'<tr><td class="mut">None.</td></tr>'}</table></div>
<div class="card scroll"><h3>Emails sent</h3><table>${emails.map(m=>`<tr><td>${fd(m.at)}</td><td>${esc(m.kind)}</td><td>${esc(m.subject)}</td><td>${esc(m.status)}</td></tr>`).join('')||'<tr><td class="mut">None.</td></tr>'}</table></div>`}catch(e){toast(e.message)}}
async function uAct(id,a){try{const r=await api(`/admin/users/${id}/${a}`,{method:'POST'});toast(r.email==='sent'?'Email sent':'Email queued ('+r.email+')')}catch(e){toast(e.message)}}
async function uPatch(id,b){try{await api('/admin/users/'+id,{method:'PATCH',json:b});toast('Updated');adminUser(id)}catch(e){toast(e.message)}}
async function savePlan(id){try{const b={name:val('pn'+id)};if(id==='trial'){b.trial_days=+val('pd'+id);b.trial_scans=+val('ps'+id)}else b.price_cents=+val('pp'+id);await api('/admin/plans/'+id,{method:'PUT',json:b});S.plans=await api('/plans');toast('Plan saved');adminTab()}catch(e){toast(e.message)}}
async function saveKeys(){const b={};[['k1','stripe_publishable_key'],['k2','stripe_secret_key'],['k3','stripe_webhook_secret'],['k4','resend_api_key'],['k5','mail_from']].forEach(([i,k])=>{const v=val(i).trim();if(v)b[k]=v});try{await api('/admin/settings',{method:'PUT',json:b});toast('Saved');adminTab()}catch(e){$('#se').textContent=e.message}}
async function saveCompare(v){try{await api('/admin/settings',{method:'PUT',json:{compare_all:String(v)}});toast('Saved')}catch(e){toast(e.message)}}
async function adm(path,ok){try{const r=await api('/admin'+path,{method:'POST'});toast(ok+(r.livemode!=null?(r.livemode?' (live)':' (test mode)'):''));adminTab()}catch(e){$('#se').textContent=e.message}}
async function testMail(){try{const r=await api('/admin/email/test',{method:'POST',json:{to:val('k6')}});toast('Test email: '+r.status)}catch(e){toast(e.message)}}
views.admin=()=>`<h2>Admin console</h2><div class="tabs">${['overview','users','plans','settings','models'].map(t=>`<button class="${S.tab===t?'on':''}" onclick="setTab('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div><div id="adm" class="mut">Loading…</div>`;
views['adm-drill']=views['adm-user']=()=>'<div class="mut">Loading…</div>';
// ---------- shared report page + boot
async function sharePage(){const t=location.pathname.split('/')[2];$('#app').innerHTML=`<header><a href="/">${logo}<span>Deer <i>Ager</i></span></a></header><main class="pub"><div class="card mut">Loading…</div></main>`;try{const r=await fetch('/api/share/'+t).then(x=>x.ok?x.json():Promise.reject());$('#app main').innerHTML=reportHtml(r,true)}catch{$('#app main').innerHTML='<div class="card">This report link is no longer available.</div>'}}
async function boot(){if(location.pathname.startsWith('/s/'))return sharePage();const q=new URLSearchParams(location.search);try{S.plans=await api('/plans')}catch{}
 if(q.get('reset')){S.view='reset';return draw()}
 if(ls.get('t')){try{S.me=await api('/me')}catch{}}
 if(q.get('verified')){toast(q.get('verified')==='1'?'Email confirmed. Welcome aboard!':'That confirmation link is invalid or expired.');history.replaceState(null,'','/')}
 if(q.get('paid')==='1'&&S.me){toast('Thanks! Activating your subscription…');history.replaceState(null,'','/');for(let i=0;i<8&&S.me.stage!=='ready';i++){await new Promise(r=>setTimeout(r,1500));S.me=await api('/me')}}
 if(q.get('paid')==='0')history.replaceState(null,'','/');
 S.hist=[];S.view=S.me?(S.me.stage==='verify'?'verify':S.me.stage==='pay'?'pay':'home'):(q.get('verified')==='1'?'login':'splash');draw()}
boot();
</script></body></html>
